blank_issues_enabled: true
contact_links:
  - name: A security problem is not a public issue
    url: https://source.tiagoagueda.com/postulo/postulo/src/branch/main/SECURITY.md
    about: Report a vulnerability privately, as SECURITY.md describes. Do not open an issue.
  - name: A wrong or missing translation
    url: https://translate.tiagoagueda.com/projects/postulo/
    about: Correct a word in Weblate, where this plugin's translations are kept, rather than reporting it here.
  - name: A question about writing a plugin
    url: https://source.tiagoagueda.com/postulo/postulo/wiki/Writing-a-plugin
    about: The wiki's guide to the whole plugin contract; the README's "Make it yours" says how to start from this one.
